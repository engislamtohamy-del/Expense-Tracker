name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, claude/expense-tracking-app-ca9tft]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest already ships the Android SDK, so no SDK setup step is needed.
      - run: npm ci
      - run: npm run typecheck && npm test
      # Generates android/ (Continuous Native Generation); it is not committed.
      - run: npx expo prebuild --platform android --no-install
      # Release build signed with the default debug keystore: installable for personal use.
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: android/app/build/outputs/apk/release/*.apk
